<!doctype html>
<html lang="es" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <title>TO-DO List</title>
    <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
<header>
    <h1 id="titulo"><i data-lucide ="list-todo"></i> Lista de tareas</h1>
</header>
<main>
    <article class="dashboard">
        <div id="vistas">
            <h2>Vistas</h2>
                <div class="contenido-vistas">
                    <button class="seleccionBoton" id="vista-todas"><i data-lucide ="gallery-vertical-end"></i> <span>Todas</span></button>
                    <button class="seleccionBoton" id="vista-hoy"><i data-lucide="sun"></i> <span>Hoy</span> </button>
                    <button class="seleccionBoton" id="vista-proximas"><i data-lucide ="calendar"></i> <span>Próximas</span></button>
                    <button class="seleccionBoton" id="vista-completadas"><i data-lucide ="check"></i> <span>Completadas</span></button>
                </div>
        </div>
        <div id="categorias">
            <h2>Categorias</h2>
                <div class="contenido-categorias">
                    <button class="seleccionBoton" id="vista-universidad"><i data-lucide ="circle" color="#d05e38" stroke-width="3"></i>
                        <span>Universidad</span></button>
                    <button class="seleccionBoton" id="vista-trabajo"><i data-lucide ="circle" color="#4289d6" stroke-width="3"></i>
                        <span>Trabajo</span></button>
                    <button class="seleccionBoton" id="vista-personal"><i data-lucide ="circle" color="#0d792f" stroke-width="3"></i>
                         <span>Personal</span></button>
                </div>
        </div>
    </article>
    <article class="contenido">
        <section class="encabezado-tareas">
            <div>
                <h2 id="fecha"> </h2>
                <p id="cantidad-tareas-pendientes"></p>
            </div>
            <button id="nueva-tarea" type="button">
                <span>＋</span>
                Nueva tarea
            </button>
        </section>
        <section class="formulario-nueva-tarea" style="display: none">
            <form id="formulario-tareas">
                <input id="tarea-nueva" type="text" placeholder="Ingrese su tarea">
                <select class="selectTareas" id="categoriaSelect" name="categoriaSelect">
                    <option value="" selected disabled> Seleccione una categoría</option>
                    <option value="Personal">Personal</option>
                    <option value="Universidad">Universidad</option>
                    <option value="Trabajo">Trabajo</option>
                </select>
                <select class="selectTareas" id="prioridadSelect" name="prioridadSelect">
                    <option value="" selected disabled> Seleccione prioridad</option>
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>
                <div class="campo-fecha">
                    <label for="selectFecha" id="date">Fecha</label>
                    <input type="date" id="selectFecha">
                </div>
                <div class="botonForm">
                    <button class="agregarCancelar" id="agregar-tarea" type="submit">Agregar</button>
                    <button class="agregarCancelar" id="cancelar-tarea" type="button">Cancelar</button>
                </div>
            </form>
        </section>
        <section class="lista-pendientes">
            <ul id="tareas-pendientes"></ul>
        </section>
        <section class="lista-completadas">
            <ul id="tareas-completadas"></ul>
        </section>
    </article>
</main>
<script src="https://unpkg.com/lucide"></script>
<script>
    lucide.createIcons();
</script>
<script src="script.js?v=1.0"></script>
</body>
</html>
